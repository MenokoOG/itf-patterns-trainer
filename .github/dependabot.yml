version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "@types/*"]
    ignore:
      # typescript-eslint pins `typescript: ">=4.8.4 <6.1.0"`, so a TypeScript
      # major lands a tree that `npm ci` refuses to install. A grouped bump to
      # 7.0.2 broke every clean clone and the Netlify deploy. Drop this entry
      # once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
