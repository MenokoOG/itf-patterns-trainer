version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "@types/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
